# Generated by `aif compile` from roles/*.yaml — do not hand-edit.
# One Codex profile per agent role. Select with: codex --profile <role>
# Mapping: write:false roles -> read-only sandbox; write:true -> workspace-write;
# network follows the role's network: flag. Codex cannot scope individual
# tools the way Claude frontmatter can, so the sandbox IS the envelope.

[profiles.reviewer]
# Read-only analysis of code, diffs, and artifacts. Produces findings reports. Never mutates the working tree.
sandbox_mode = "read-only"
approval_policy = "never"
# role policy permits READ-ONLY network (e.g. gh pr view); Codex's
# read-only sandbox blocks network, so such commands will surface as
# approval requests — approve reads only.

[profiles.scanner]
# Scheduled/on-demand scans for optimization opportunities (cost, latency, DB). Findings only.
sandbox_mode = "read-only"
approval_policy = "never"

[profiles.explorer]
# Cheap, fast codebase mapping — blast radius, precedents, integration surfaces. Returns structure, not judgments.
sandbox_mode = "read-only"
approval_policy = "never"
# role policy permits READ-ONLY network (e.g. gh pr view); Codex's
# read-only sandbox blocks network, so such commands will surface as
# approval requests — approve reads only.

[profiles.implementer]
# Implements one scoped task inside a designated worktree — edits, tests, commits within that boundary.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
[profiles.implementer.sandbox_workspace_write]
network_access = true
# role policy: network is READ-ONLY (dependency fetch etc.) — Codex
# cannot enforce read-vs-write network; the sandbox flag above is the
# closest mapping. Gateway enforcement: see compiled/cedar/.

[profiles.orchestrator]
# Drives multi-phase pipelines or long-running chores end to end (pipeline runs, PR babysitting, stack/regression lifecycles). May dispatch work and post to configured channels.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
[profiles.orchestrator.sandbox_workspace_write]
network_access = true
